# Материалы, из которых можно создать приватный блок.
# Рецепт для каждого материала: 9 одинаковых обычных блоков в сетке 3x3.
# Результат выглядит как исходный блок, но имеет скрытую метку PrivateStone.
claimBlocks:
  - STONE
  - OAK_LOG
  - SPRUCE_LOG
  - BIRCH_LOG
  - JUNGLE_LOG
  - ACACIA_LOG
  - DARK_OAK_LOG
  - MANGROVE_LOG
  - CHERRY_LOG
  - PALE_OAK_LOG
  - CRIMSON_STEM
  - WARPED_STEM
  - OAK_WOOD
  - SPRUCE_WOOD
  - BIRCH_WOOD
  - JUNGLE_WOOD
  - ACACIA_WOOD
  - DARK_OAK_WOOD
  - MANGROVE_WOOD
  - CHERRY_WOOD
  - PALE_OAK_WOOD
  - CRIMSON_HYPHAE
  - WARPED_HYPHAE

allowOverlap: false
maxSide: 128
protectFromExplosions: true

claimItem:
  name: "&aПриватный блок: &e%block%"
  lore:
    - "&7Поставь два приватных блока, чтобы создать участок."
    - "&7Можно использовать блоки разных материалов."
    - "&7Для крафта нужно 9 одинаковых обычных блоков."
  defaultGiveAmount: 2

claimAutoNameFormat: "Участок %n% %player%"
claimNameMaxLength: 32

messages:
  noPerm: "&cНет прав."
  onlyPlayers: "&cТолько для игроков."
  giveOk: "&aВыдано &e%amount%&a шт. приватного блока &e%player%&a."
  firstCorner: "&eПервый угол установлен. Поставь второй приватный блок."
  created: "&aПриват создан: &e%claimName% &7(&e%sizeX%x%sizeZ%&7)&a. Владелец: &e%owner%&a."
  tooLarge: "&cСлишком большой приват. Макс сторона: &e%max%&c."
  overlap: "&cПриват пересекается с существующим. Включи allowOverlap или выбери другое место."
  insideOther: "&cЭто зона привата игрока &e%owner%&c."
  removed: "&cУдалён участок: &e%claimName% &7(ID: &f%claimId%&7)&c."
  cantBreakAnchor: "&cНельзя ломать приватный блок чужого участка."
  trustOk: "&aТеперь игрок &e%player%&a доверен в этом привате."
  untrustOk: "&aИгрок &e%player%&a больше не доверен в этом привате."
  notInClaim: "&cТы не в привате."
  notOwner: "&cТы не владелец этого привата."
  renameUsage: "&cИспользование: /pstone rename <новое_имя>"
  renameOk: "&aУчасток переименован в: &e%claimName%"
  renameTooLong: "&cСлишком длинное имя. Макс: &e%max%&c символов."
  renameEmpty: "&cИмя не может быть пустым."
  info:
    - "&a--- &ePrivateStone &a---"
    - "&7Название: &e%claimName%"
    - "&7Владелец: &e%owner%"
    - "&7Размер: &e%sizeX%x%sizeZ%"
    - "&7Доверенные: &e%trusted%"
