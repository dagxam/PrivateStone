name: Build and Release (Java 21)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Запускать создание релиза при пуше тега, например v1.0.0
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Права, необходимые для создания релиза в GitHub
    permissions:
      contents: write 

    steps:
      # 1. Получаем репозиторий
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK 21 (Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Собираем плагин Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # 4. Загружаем готовый .jar как артефакт (сохраняется в GitHub Actions)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateStone
          path: target/*.jar

      # 5. Автоматически создаем Release и загружаем туда .jar (только для тегов)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/*.jar
          name: Release ${{ github.ref_name }}
          generate_release_notes: true # Автоматически сгенерирует список изменений (changelog)
