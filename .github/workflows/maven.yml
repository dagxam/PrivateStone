name: Сборка и Релиз (Java 21)

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Релиз будет создаваться только при пуше тега, например v1.0.0
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Выдаем боту права на создание релиза
    permissions:
      contents: write 

    steps:
      # 1. Получаем код вашего плагина
      - name: 📥 Скачивание репозитория
        uses: actions/checkout@v4

      # 2. Настраиваем Java
      - name: ☕ Установка JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Собираем плагин
      - name: 🛠️ Сборка плагина через Maven
        run: mvn -B package --file pom.xml

      # 4. Сохраняем готовый .jar файл в Actions (чтобы можно было скачать просто так)
      - name: 📦 Сохранение .jar файла
        uses: actions/upload-artifact@v4
        with:
          name: PrivateStone-Сборка
          path: target/*.jar

      # 5. Создаем Релиз (Сработает ТОЛЬКО если вы запушите тег v...)
      - name: 🚀 Создание GitHub Релиза
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/*.jar
          name: 🚀 Оф. Релиз ${{ github.ref_name }} # Название релиза на русском
          body: |
            ## 🎉 Новая версия плагина PrivateStone!
            
            Версия: **${{ github.ref_name }}**
            
            Автоматическая сборка плагина завершена успешно. Готовый `.jar` файл прикреплен ниже в разделе **Assets**.
            
            ### 📝 Что нового:
          generate_release_notes: true # GitHub автоматически добавит список ваших коммитов под текстом
